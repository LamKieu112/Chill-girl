<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" type="image/jpeg" href="favicon.jpg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moonlit Camp</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Noto+Sans+SC:wght@500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
</head>
*{box-sizing:border-box}
:root{--panel:#f5e6c4;--ink:#3a2314;--wood:#6a4029;--wood-hi:#9a6238;--fire:#ff9a3c;--bar:#d9c08f;--hud:rgba(20,18,50,.74);--cream:#fff1cf}
#scene,.ic{shape-rendering:crispEdges;image-rendering:pixelated}
#scene .o,#scene .o2{stroke-linejoin:miter;stroke-linecap:square}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2a2136;--ink:#f3e4c6;--bar:#3f3350}}
:root[data-theme="dark"]{--panel:#2a2136;--ink:#f3e4c6;--bar:#3f3350}
html,body{height:100%;margin:0;background:#0d1030;color:var(--cream)}
body{font:600 16px/1.55 'Nunito','Noto Sans SC',system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:'Baloo 2','ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-weight:800;margin:0}
:lang(zh) h1,:lang(zh) h2,:lang(zh) h3{font-family:'ZCOOL KuaiLe','Baloo 2',sans-serif;font-weight:400}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:12px;padding:14px 16px;pointer-events:none;z-index:2}
#hud>*{pointer-events:auto}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;text-shadow:0 3px 0 #150d1f}
.role{margin:4px 0 0;text-shadow:0 2px 0 #150d1f}
.res{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.res span{background:var(--hud);border:3px solid var(--wood);border-radius:999px;padding:2px 12px 2px 8px;font-weight:800;font-size:14px;white-space:nowrap}
.res b{font-variant-numeric:tabular-nums}
.lang{display:flex;border:3px solid var(--wood);border-radius:12px;overflow:hidden;height:fit-content;background:var(--hud)}
.lang button{font:inherit;font-weight:800;padding:4px 12px;background:none;border:0;color:var(--cream);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--fire);color:#2a1408}
nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding:8px;background:var(--wood);border:4px solid #3a2314;border-radius:18px;box-shadow:0 5px 0 #24140b;z-index:3}
nav button{font:inherit;font-weight:800;display:flex;flex-direction:column;align-items:center;min-width:64px;padding:6px 8px;border:3px solid #3a2314;border-radius:12px;background:var(--wood-hi);color:var(--cream);cursor:pointer}
nav button:hover,nav button[aria-current=true]{background:var(--fire);color:#2a1408}
nav span{font-size:22px;line-height:1.1}
nav small{font-size:12px}
#panel{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);width:min(580px,calc(100vw - 24px));max-height:calc(100svh - 200px);overflow:auto;background:var(--panel);color:var(--ink);border:6px solid var(--wood);border-radius:20px;box-shadow:0 0 0 3px #24140b,0 12px 30px rgba(0,0,0,.5);padding:14px 20px 20px;z-index:4;animation:up .25s ease-out}
#panel[hidden]{display:none}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h2{font-size:28px}
h3{font-size:19px;margin:14px 0 6px}
#panel p{margin:0}
#panel ul,#panel ol{margin:0;padding-left:20px}
#x{font:inherit;font-weight:800;border:3px solid var(--wood);background:var(--wood-hi);color:var(--cream);border-radius:10px;width:36px;height:36px;cursor:pointer}
.chips span{display:inline-block;margin:0 6px 6px 0;padding:1px 12px;border-radius:999px;background:var(--wood);color:var(--cream)}
.q{margin-bottom:10px}.q i{font-style:normal;opacity:.75;margin-left:8px;font-size:14px}
.bar{height:12px;background:var(--bar);border:2px solid var(--wood);border-radius:8px;overflow:hidden;margin-top:4px}
.bar u{display:block;height:100%;background:linear-gradient(90deg,#e2792b,#ffcb5c)}
.pubs li{margin-bottom:8px}.pubs small{display:block;opacity:.75}
.ct{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.pop{position:fixed;pointer-events:none;font:800 22px 'Baloo 2',sans-serif;color:#ffd66b;text-shadow:0 2px 0 #150d1f;animation:pop 1s forwards;z-index:5}
@keyframes pop{to{transform:translateY(-60px);opacity:0}}
.o{stroke:#150d1f;stroke-width:3.5;stroke-linejoin:miter;stroke-linecap:square}
.hot{cursor:pointer;outline:none;transition:filter .2s}
.hot:hover,.hot:focus-visible{filter:brightness(1.35) drop-shadow(0 0 0 #ffd66b)}
.tw{animation:tw 1.2s steps(2) infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .5s steps(4) infinite alternate}
.fl2{animation-duration:.4s;animation-delay:-.2s}
@keyframes fl{from{transform:scale(1,1)}25%{transform:scale(.92,1.06)}50%{transform:scale(1.05,.95)}to{transform:scale(.96,1.1)}}
.gl{transform-box:fill-box;transform-origin:center;animation:gl 1.6s steps(3) infinite alternate}
@keyframes gl{from{opacity:.7;transform:scale(1)}to{opacity:1;transform:scale(1.12)}}
.sp{animation:sp 2.6s steps(6) infinite}
@keyframes sp{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--x),-140px);opacity:0}}
.ff{animation:ff 7s steps(10) infinite}
@keyframes ff{0%{transform:translate(0,0);opacity:0}30%,70%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.mist{animation:mist 16s steps(8) infinite alternate}
@keyframes mist{to{transform:translateX(60px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#panel p+p{margin-top:8px}
#panel a{color:inherit}
.ic{width:26px;height:26px;display:block;overflow:visible}
.res .ic{width:18px;height:18px;display:inline-block;vertical-align:-4px}
nav{gap:4px;padding:6px;max-width:calc(100vw - 12px)}
nav button{min-width:0;flex:1 1 0;padding:5px 6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 3px 0 #24140b;transition:transform .1s}
nav button:active{transform:translateY(2px)}
nav small{font-size:11px;white-space:nowrap}
nav button:hover .ic{animation:hop .4s}
@keyframes hop{50%{transform:translateY(-4px) rotate(-8deg)}}
.btn{display:inline-block;font:inherit;font-weight:800;text-decoration:none;color:#2a1408!important;background:var(--fire);border:3px solid #24140b;border-radius:12px;padding:6px 16px;box-shadow:0 3px 0 #24140b;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #24140b}
#bub{position:fixed;left:0;top:0;z-index:2;max-width:min(260px,70vw);background:#fff;color:#20223a;border:3px solid #150d1f;border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.4;font-weight:700;pointer-events:none;box-shadow:0 3px 0 #150d1f;opacity:0;transition:opacity .35s}
#bub.on{opacity:1}
#bub:after{content:"";position:absolute;bottom:-10px;left:var(--tx,50%);width:14px;height:14px;background:#fff;border:3px solid #150d1f;border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
.lab{opacity:0;transition:opacity .2s;pointer-events:none}
.lab text{font-family:'Baloo 2','ZCOOL KuaiLe','Noto Sans SC',sans-serif}
.hot:hover .lab,.hot:focus-visible .lab{opacity:1}
.spk{transform-box:fill-box;transform-origin:center;animation:spk 1.2s steps(2) infinite}
@keyframes spk{50%{transform:scale(.6);opacity:.55}}
.o2{stroke:#150d1f;stroke-width:2.2;stroke-linejoin:round}
.stm{animation:stm 1.2s steps(3) infinite alternate}
@keyframes stm{from{opacity:.25;transform:translateY(2px)}to{opacity:.9;transform:translateY(-4px)}}
.steps li{margin-bottom:4px}
#lib{position:fixed;inset:0;z-index:6;overflow:auto;padding:16px;background:radial-gradient(ellipse at 50% 0,#2b2a6b,#0d1030 70%)}
#lib .top{display:flex;align-items:center;gap:14px;max-width:820px;margin:0 auto 16px}
#lib main{max-width:820px;margin:0 auto}
.bk{display:flex;gap:14px;width:100%;text-align:left;text-decoration:none;font:inherit;background:var(--panel);color:var(--ink);border:5px solid var(--wood);border-radius:16px;padding:14px;cursor:pointer;box-shadow:0 5px 0 #24140b;margin-bottom:12px}
.bk:hover{transform:translateY(-2px)}
.bk h3{margin:0 0 4px}.bk p{margin:0}
.spine{flex:0 0 76px;height:108px;display:grid;place-items:center;text-align:center;padding:6px;border:3px solid #150d1f;border-radius:6px 12px 12px 6px;background:linear-gradient(90deg,#3a1d1d,#7a2a2a 45%,#5a1f1f);color:#ffd66b;font:800 17px/1.1 'Baloo 2',sans-serif}
.rd{display:grid;grid-template-columns:210px 1fr;gap:14px;align-items:start}
@media(max-width:640px){.rd{grid-template-columns:1fr}}
.chb{display:block;width:100%;text-align:left;font:inherit;font-weight:800;margin-bottom:6px;padding:6px 12px;border:3px solid #24140b;border-radius:10px;background:var(--wood-hi);color:var(--cream);cursor:pointer}
.chb[aria-current=true]{background:var(--fire);color:#2a1408}
#reader article{background:var(--panel);color:var(--ink);border:5px solid var(--wood);border-radius:16px;padding:18px 22px;font:500 17px/1.85 Georgia,'Noto Sans SC',serif}
.soon{opacity:.75}
body{font-family:'VT323','Noto Sans SC',monospace;font-size:20px;line-height:1.3}
h1,h2,h3,nav small,.btn,.spine,.chb{font-family:'Press Start 2P',monospace;font-weight:400}
h1{font-size:clamp(16px,2.6vw,24px);line-height:1.3}h2{font-size:16px}h3{font-size:11px;line-height:1.5}
nav small{font-size:7px}.btn,.chb{font-size:10px}.spine{font-size:9px}.lab text{font-family:'Press Start 2P',monospace;font-size:8px}
.res span,.lang button{font-family:'VT323',monospace;font-size:20px}
#bub{font-family:'VT323','Noto Sans SC',monospace;font-size:20px;font-weight:400}
:lang(zh) body,:lang(zh) #bub,:lang(zh) .res span,:lang(zh) .lang button{font-family:'Noto Sans SC',sans-serif;font-size:15px}
:lang(zh) nav small,:lang(zh) .btn,:lang(zh) .chb,:lang(zh) .spine,:lang(zh) .lab text{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-size:13px}
:lang(zh) nav small{font-size:11px}
.rt{display:flex;gap:8px;height:fit-content}
.gear{background:var(--hud);border:3px solid var(--wood);width:40px;height:34px;padding:3px;cursor:pointer;display:grid;place-items:center}
.gear .ic{width:22px;height:22px}
.st{display:none}.st.on{display:inline}
.btn[aria-pressed=true]{outline:3px solid #fff}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
#vol{width:150px;vertical-align:middle;margin-right:8px}
h1{font-family:'VT323',monospace;font-size:clamp(28px,4.5vw,44px);line-height:1.1}
.hf{transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s steps(4)}
.head{transform-box:fill-box;transform-origin:50% 100%;transform:scaleX(-1) rotate(0deg)}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes sway2{from{transform:rotate(5deg)}to{transform:rotate(9deg)}}
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0d1030;text-align:center;overflow:hidden}
#gate .box{background:var(--panel);color:var(--ink);border:6px solid var(--wood);box-shadow:0 0 0 3px #24140b;padding:24px 28px;max-width:92vw}
#gate h2{font-size:clamp(14px,3.4vw,22px);margin-bottom:6px}
#gate .row{display:flex;gap:28px;justify-content:center;align-items:center;margin-top:20px;height:70px}
#gate .btn{font-size:14px;transition:transform .25s steps(4)}
#gy{position:relative;z-index:2}
#gm{min-height:24px;margin:10px 0 0;font-weight:700}
#girl{pointer-events:none}
.win{fill:#a9dcea}#scene.night .win{fill:#ffcb5c}#scene.dusk .win{fill:#ffb77a}
.sg{font-family:'Press Start 2P',monospace;font-size:15px;fill:#ffd66b;text-anchor:middle}
:lang(zh) .sg{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-size:24px}
:root[data-period="morning"] h1,
:root[data-period="noon"] h1,
:root[data-period="morning"] .role,
:root[data-period="noon"] .role{
  color:#2a1408;
  text-shadow:0 0 3px #fff8dc,0 0 6px #fff8dc,0 2px 0 #fff8dc;
}
:root[data-period="morning"] nav small,
:root[data-period="noon"] nav small{color:#fff1cf}
</style>
</head>
